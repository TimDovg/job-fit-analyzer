services:
  - type: keyvalue
    name: job-fit-setup-links
    plan: free
    ipAllowList: []

  - type: web
    name: job-fit-notification-relay
    runtime: node
    plan: free
    buildCommand: npm ci && npm run build
    startCommand: npm run relay
    healthCheckPath: /health
    envVars:
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_WEBHOOK_SECRET
        sync: false
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: job-fit-setup-links
          property: connectionString
